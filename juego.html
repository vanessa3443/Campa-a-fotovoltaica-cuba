<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cazador de Sol – El Precio del Sol en Cuba</title>
<style>
:root{--bg:#fff7ea;--card:#ffffff;--tx:#2a1d0a;--ac:#e8890c;--ac2:#c2410c;--mu:#7a6a52;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#1b2035;--tx:#f5efe3;--ac:#f6a93b;--ac2:#ff7a59;--mu:#a9a6b8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#1b2035;--tx:#f5efe3;--ac:#f6a93b;--ac2:#ff7a59;--mu:#a9a6b8;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:10px;gap:8px;overflow-x:hidden}
h1{font-size:1.2rem;margin:4px 0 0;color:var(--ac);text-align:center}
.hud{display:flex;gap:8px;width:100%;max-width:420px}
.hud div{flex:1;background:var(--card);border-radius:12px;padding:6px 8px;text-align:center;font-size:.8rem;color:var(--mu)}
.hud b{display:block;font-size:1.1rem;color:var(--tx)}
.bar{width:100%;max-width:420px;height:12px;background:var(--card);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .2s}
.wrap{position:relative;width:100%;max-width:420px;flex:1;min-height:0}
canvas{width:100%;height:100%;border-radius:16px;background:linear-gradient(#1a2a5e,#e8890c 130%);touch-action:none;display:block}
.ov{position:absolute;inset:0;background:rgba(10,12,25,.88);color:#fff;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:10px}
.ov h2{margin:0;color:#f6a93b}.ov p{margin:0;line-height:1.4;font-size:.95rem}
button,a.btn{background:linear-gradient(90deg,#f6a93b,#ff7a59);color:#1a1205;border:0;border-radius:99px;padding:12px 26px;font-size:1rem;font-weight:700;text-decoration:none;cursor:pointer}
a.alt{background:none;border:2px solid #f6a93b;color:#f6a93b}
.hide{display:none}
</style>
</head>
<body>
<h1>☀️ Cazador de Sol</h1>
<div class="hud">
  <div>Energía<b id="kwh">0 kWh</b></div>
  <div>Vidas<b id="lives">❤️❤️❤️</b></div>
  <div>Ahorro<b id="cup">0 CUP</b></div>
</div>
<div class="bar"><i id="bar"></i></div>
<div class="wrap">
  <canvas id="c"></canvas>
  <div class="ov" id="start">
    <h2>El Precio del Sol en Cuba</h2>
    <p>Mueve tu panel de 540 W y atrapa los rayos de sol ☀️. Esquiva los apagones 🌑.</p>
    <p>Reúne 30 kWh para completar tu kit solar de 75 200 CUP.</p>
    <button id="go">Jugar</button>
  </div>
  <div class="ov hide" id="end">
    <h2 id="etitle"></h2>
    <p id="etext"></p>
    <button id="again">Jugar de nuevo</button>
    <a class="btn alt" href="https://vanessa3443.github.io/Campa-a-fotovoltaica-cuba/" target="_blank" rel="noopener">Ver la campaña</a>
  </div>
</div>
<script>
const SAL=7400, KIT=75200, META=30;
const cv=document.getElementById('c'), cx=cv.getContext('2d');
let W,H,px,items,kwh,lives,run,t,last;
function size(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;cx.setTransform(d,0,0,d,0,0);W=r.width;H=r.height;px=px||W/2}
addEventListener('resize',size);
function move(e){const r=cv.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;px=Math.max(40,Math.min(W-40,x))}
cv.addEventListener('pointermove',move);cv.addEventListener('touchmove',move,{passive:true});cv.addEventListener('pointerdown',move);
function reset(){size();items=[];kwh=0;lives=3;t=0;last=performance.now();px=W/2;hud()}
function hud(){
  document.getElementById('kwh').textContent=kwh+' kWh';
  document.getElementById('lives').textContent='❤️'.repeat(lives)||'💀';
  document.getElementById('cup').textContent=Math.round(KIT*kwh/META).toLocaleString('es')+' CUP';
  document.
  getElementById('bar').style.width=(kwh/META*100)+'%';
}
function loop(n){
  if(!run)return;
  const dt=Math.min(40,n-last);last=n;t+=dt;
  const lvl=1+kwh/12;
  if(Math.random()<dt/(650/lvl))items.push({x:30+Math.random()*(W-60),y:-20,sun:Math.random()<.7,v:.12+Math.random()*.08});
  cx.clearRect(0,0,W,H);
  cx.font='34px serif';cx.textAlign='center';cx.textBaseline='middle';
  for(const o of items){o.y+=o.v*dt*lvl;cx.fillText(o.sun?'☀️':'🌑',o.x,o.y);
    if(o.y>H-50&&Math.abs(o.x-px)<42&&!o.done){o.done=1;
      if(o.sun)kwh++;else lives--;hud();}
  }
  items=items.filter(o=>!o.done&&o.y<H+30);
  cx.fillText('🔋',px,H-28);
  cx.fillStyle='#1f4fa8';cx.fillRect(px-36,H-62,72,14);cx.fillStyle='#8fb6ff';
  for(let i=1;i<4;i++)cx.fillRect(px-36+i*18,H-62,1.5,14);
  if(kwh>=META)return fin(true);
  if(lives<=0)return fin(false);
  requestAnimationFrame(loop);
}
function fin(win){
  run=false;
  document.getElementById('etitle').textContent=win?'¡Kit solar completado! ☀️':'Apagón… 🌑';
  document.getElementById('etext').innerHTML=(win?'Lo lograste en el juego. ':'Reuniste '+kwh+' kWh. ')+
  'Pero en la vida real un salario medio es <b>'+SAL.toLocaleString('es')+' CUP</b> y el kit de 800 W cuesta <b>'+KIT.toLocaleString('es')+' CUP</b>: '+
  'son unos <b>'+(KIT/SAL).toFixed(1)+' salarios</b> sin gastar nada más. Ayúdanos a llevar el sol a más hogares cubanos.';
  document.getElementById('end').classList.remove('hide');
}
function start(){
  document.getElementById('start').classList.add('hide');
  document.getElementById('end').classList.add('hide');
  reset();run=true;requestAnimationFrame(loop);
}
document.getElementById('go').onclick=start;
document.getElementById('again').onclick=start;
size();
</script>
</body>
</html>
